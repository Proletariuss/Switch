version: 3
kind: carrier_bundle
id: apple_claro_pr
bundle: Claro_pr.bundle
supported_plmns:
    - "33011"
    - "330110"
common:
    apns:
        - apn: lte.claropr.com
          type_mask: 1081399
          tech_type_mask: 1048578
          allowed_ip_stack: ipv4v6
        - apn: ims
          type_mask: 131072
          tech_type_mask: 131072
          allowed_ip_stack: ipv4v6
          support_switch_over: true
        - apn: sos
          type_mask: 262144
          tech_type_mask: 262144
          allowed_ip_stack: ipv4v6
          allow_no_dns: 1
    apple:
        carrier_entitlements:
            supported_entitlements: 1041
    e911:
        over_itech_supported: false
        wifi_calling_without_entitlement: true
    entitlement:
        entitlement_url: https://aes.mnc110.mcc330.pub.3gppnetwork.org/entitlement/
    ims:
        apn: ims
        epdg:
            address: epdg.epc.mnc110.mcc330.pub.3gppnetwork.org
            configuration_attributes:
                - identifier: 16389
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 16390
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes256
                      integrity:
                        - sha256
                      rekey_pfs_group: 14
                      esn: auto
                      install_policies: true
                      lifetime_seconds: 86400
                replay_window_size: 12
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: anonymous@nai.epc.mnc110.mcc330.3gppnetwork.org
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - 14
                  lifetime_seconds: 86400
                  authentication_method: Certificate
                  eap_method: EAP-AKA
            remote_certificate_authority_name: DigiCert Global G2 TLS RSA SHA256 2020 CA1
            remote_certificate_hostname: epdg.epc.mnc110.mcc330.pub.3gppnetwork.org
            username: 0$imsi@nai.epc.mnc110.mcc330.3gppnetwork.org
            validate_remote_certificate: true
        ip_stack: ipv4v6
        register:
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                always_add_sip_instance: true
            early_media_needs_header: true
            preconditions: supported
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: true
