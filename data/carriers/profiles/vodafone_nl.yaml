version: 3
kind: carrier_bundle
id: apple_vodafone_nl
bundle: Vodafone_nl.bundle
supported_plmns:
    - "20404"
    - "26202"
common:
    apns:
        - apn: live.vodafone.com
          username: vodafone
          password: vodafone
          type_mask: 32817
        - apn: ims
          type_mask: 131072
          tech_type_mask: 131072
          support_switch_over: true
          allow_no_dns: 1
        - apn: sos
          type_mask: 262144
          tech_type_mask: 262144
          allow_no_dns: 1
    apple:
        carrier_entitlements:
            supported_entitlements: 9216
    e911:
        over_itech_supported: false
        wifi_calling_without_entitlement: true
    entitlement:
        entitlement_url: https://es-nl.multiopco.entitlement.vodafone.com:4454/ium-OEMInterface/servlet/IUMServlet
    ims:
        apn: ims
        epdg:
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
        ike:
            child_sa:
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes256
                      integrity:
                        - sha256
                      rekey_pfs_group: 14
                      esn: auto
                      install_policies: true
                      lifetime_seconds: 80000
                replay_window_size: 12
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: anonymous@nai.epc.mnc004.mcc204.3gppnetwork.org
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha256
                  prf:
                    - sha512
                  dh_groups:
                    - 14
                  lifetime_seconds: 80000
                  authentication_method: Certificate
                  eap_method: EAP-AKA
            remote_certificate_authority_name: DigiCert Global Root G2
            remote_certificate_hostname: epdg.epc.mnc004.mcc204.pub.3gppnetwork.org
            username: 0$imsi@nai.epc.mnc004.mcc204.3gppnetwork.org
            validate_remote_certificate: true
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                always_add_sip_instance: true
            early_media_needs_header: true
            preconditions: supported
            require_preconditions_when_mandatory: false
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: false
plmn_overrides:
    "20404":
        ims:
            epdg:
                address: epdg.epc.mnc004.mcc204.pub.3gppnetwork.org
    "26202":
        ims:
            epdg:
                address: epdg.epc.mnc002.mcc262.pub.3gppnetwork.org
