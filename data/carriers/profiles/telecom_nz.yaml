version: 3
kind: carrier_bundle
id: apple_telecom_nz
bundle: Telecom_nz.bundle
supported_plmns:
    - "23410"
    - "53005"
common:
    apns:
        - apn: internet
          type_mask: 32821
          tech_type_mask: 4
          use_network_mtu: true
        - apn: ims
          type_mask: 131072
          tech_type_mask: 131072
          allowed_ip_stack: ipv6
          support_switch_over: true
        - apn: xcap
          type_mask: 1048576
          tech_type_mask: 1048576
          allowed_ip_stack: ipv4
        - apn: sos
          type_mask: 262144
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4v6
          allow_no_dns: 1
    apple:
        carrier_entitlements:
            supported_entitlements: 9217
    e911:
        over_itech_supported: true
        wifi_calling_without_entitlement: true
    entitlement:
        entitlement_url: https://cdp.spark.co.nz/entitlement/
    ims:
        apn: ims
        epdg:
            address: epdg.epc.mnc005.mcc530.pub.3gppnetwork.spark.co.nz
            configuration_attributes:
                - identifier: 20
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 21
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes256
                      integrity:
                        - sha256
                      rekey_pfs_group: 14
                      esn: auto
                      install_policies: true
                      lifetime_seconds: 86400
                replay_window_size: 12
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - 14
                  lifetime_seconds: 86400
                  authentication_method: Certificate
                  eap_method: EAP-AKA
            remote_certificate_authority_name: DigiCert Global Root G2
            remote_certificate_hostname: epdg.epc.mnc005.mcc530.pub.3gppnetwork.spark.co.nz
            validate_remote_certificate: true
        ip_stack: ipv6
        media:
            rtp_inactivity_seconds: 10
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            early_media_needs_header: true
            preconditions: supported
            require_preconditions_when_mandatory: false
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: true
