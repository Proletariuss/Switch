version: 3
kind: carrier_bundle
id: apple_singtel_sg
bundle: SingTel_sg.bundle
supported_plmns:
    - "52501"
plmn_overrides:
    "52501":
        apns:
            - apn: e-ideas
              username: 65ideas
              password: 65ideas
              type_mask: 32821
              allowed_ip_stack: ipv4v6
            - apn: ims
              type_mask: 131072
              tech_type_mask: 131072
              allowed_ip_stack: ipv6
              roaming_ip_stack: ipv4v6
              support_switch_over: true
            - apn: stm-ut
              type_mask: 1048576
              tech_type_mask: 1048576
              allowed_ip_stack: ipv6
        apple:
            carrier_entitlements:
                supported_entitlements: 4197377
        e911:
            over_itech_supported: true
            wifi_calling_without_entitlement: true
            emergency_urns:
                "995": urn:service:sos.ambulance
                "999": urn:service:sos.police
        entitlement:
            entitlement_url: https://ses.singtel.com
        ims:
            apn: ims
            ip_stack: ipv4v6
            epdg:
                address: epdg.epc.mnc001.mcc525.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes128
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 80000
                      authentication_method: Certificate
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes128
                          integrity:
                            - sha256
                          rekey_pfs_group: 14
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 80000
                    replay_window_size: 12
                local_identifier: anonymous@nai.epc.mnc001.mcc525.3gppnetwork.org
                username: 0$imsi@nai.epc.mnc001.mcc525.3gppnetwork.org
                remote_certificate_authority_name: DigiCert Global Root G2
                remote_certificate_hostname: epdg.epc.mnc001.mcc525.pub.3gppnetwork.org
                validate_remote_certificate: true
            register:
                use_ipsec: true
            signaling:
                preconditions: unsupported
                support_p_early_media: true
                early_media_needs_header: true
                contact:
                    additional_contact_params:
                        - selector: INVITE,INVITE:*
                          params:
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                            - +g.3gpp.mid-call
                additional_headers:
                    - selector: INVITE
                      headers:
                        - Supported:histinfo
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: false
