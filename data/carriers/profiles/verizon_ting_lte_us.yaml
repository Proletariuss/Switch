version: 3
kind: carrier_bundle
id: apple_verizon_ting_lte_us
bundle: Verizon_Ting_LTE_US.bundle
supported_plmns:
    - "20404"
    - "311480"
common:
    apns:
        - apn: vzwinternet
          type_mask: 51
        - apn: vzwapp
          type_mask: 32772
        - apn: vzwinternet
          type_mask: 51
          allowed_ip_stack: ipv4v6
        - apn: vzwapp
          type_mask: 49156
          allowed_ip_stack: ipv4v6
        - apn: vzwadmin
          type_mask: 512
          allowed_ip_stack: ipv4v6
    apple:
        carrier_entitlements:
            supported_entitlements: 25
    e911:
        emergency_urns:
            "922": 922@vzims.com
        over_itech_supported: false
        wifi_calling_without_entitlement: false
    entitlement:
        entitlement_url: https://spc.myvzw.com/ium-RoadrunnerInterface/servlet/IUMServlet
    ims:
        epdg:
            address: wo.vzwwo.com
            configuration_attributes:
                - identifier: 16390
                  name: AssignedPCSCFIPv6
                  type: v6
            timeout_seconds: 30
        ike:
            child_sa:
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes128
                      integrity:
                        - sha1
                      protocol: esp
                      esn: auto
                      install_policies: true
                      secure_rekey: false
                      lifetime_seconds: 86400
            disable_switch_to_natt_port: true
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$impi_user@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha1
                  prf:
                    - sha1
                  dh_groups:
                    - 14
                  lifetime_seconds: 80000
                  authentication_method: None
                  eap_method: EAP-AKA
        media:
            rtcp_inactivity_seconds: 20
            rtcp_interval_seconds: 5
            rtp_inactivity_seconds: 20
        signaling:
            additional_headers:
                - selector: INVITE[911,wifi]
                  headers:
                    - 'P-com.ServiceType: Static-Emergency'
            csfb_on:
                - method: INVITE
                  statuses:
                    - "503"
            early_media_needs_header: false
            preconditions: unsupported
            require_preconditions_when_mandatory: false
            sip_timers:
                D: 128000
                F: 30000
                InviteResponseTimeout: 10000
                T1: 3000
                T2: 16000
                T4: 17000
            support_p_early_media: false
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: true
