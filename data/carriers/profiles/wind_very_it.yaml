version: 3
kind: carrier_bundle
id: apple_wind_very_it
bundle: Wind_Very_it.bundle
supported_plmns:
    - "22288"
    - "22299"
common:
    apns:
        - apn: internet.it
          type_mask: 49
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4
        - apn: mms.it
          type_mask: 4
        - apn: ims
          type_mask: 131072
          tech_type_mask: 131072
          allowed_ip_stack: ipv4v6
          support_switch_over: true
          use_network_mtu: true
          no_cellular_reconnect_cause_codes:
            - cause_codes:
                - 33
              recovers_on_airplane_mode: true
              num_tries_allowed: 3
              type: 3GPP
              timeout: 86400
        - apn: xcap
          type_mask: 1048576
          tech_type_mask: 1048576
          allowed_ip_stack: ipv4
        - apn: sos
          type_mask: 262144
          tech_type_mask: 262144
          allowed_ip_stack: ipv4v6
    e911:
        over_itech_supported: false
        wifi_calling_without_entitlement: true
    ims:
        apn: ims
        epdg:
            address: epdg.epc.mnc088.mcc222.pub.3gppnetwork.org
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 16386
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes256
                      integrity:
                        - sha512
                      esn: auto
                      lifetime_seconds: 86400
            nat_keepalive_enabled: true
        ip_stack: ipv4v6
        media:
            rtp_inactivity_seconds: 20
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                        - text
                always_add_sip_instance: true
            csfb_on:
                - method: INVITE
                  statuses:
                    - 3XX
                    - 4XX
                    - 5XX
                    - 6XX
            early_media_needs_header: true
            preconditions: supported
            require_preconditions_when_mandatory: false
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: false
