version: 3
kind: carrier_bundle
id: apple_verizon_visible_lte_us
bundle: Verizon_Visible_LTE_US.bundle
supported_plmns:
    - "20404"
    - "311480"
common:
    apns:
        - apn: vsblinternet
          type_mask: 4194323
          domestic_roaming_ip_stack: ipv4
        - apn: vsblapp
          type_mask: 49156
          tech_type_mask: 16390
        - apn: vsblims
          type_mask: 131072
          tech_type_mask: 131072
          allowed_ip_stack: ipv6
          roaming_ip_stack: ipv6
          support_switch_over: false
        - apn: vsblinternet
          type_mask: 4194323
          allowed_ip_stack: ipv4v6
          domestic_roaming_ip_stack: ipv4
        - apn: vsblapp
          type_mask: 49156
          tech_type_mask: 16390
          allowed_ip_stack: ipv4v6
        - apn: vsblims
          type_mask: 131072
          tech_type_mask: 131072
          allowed_ip_stack: ipv6
          roaming_ip_stack: ipv6
          support_switch_over: true
          no_cellular_reconnect_cause_codes:
            - cause_codes:
                - 8
              num_tries_allowed: 2
              type: 3GPP
            - cause_codes:
                - 27
              num_tries_allowed: 2
              type: 3GPP
            - cause_codes:
                - 29
              num_tries_allowed: 2
              type: 3GPP
            - cause_codes:
                - 32
              num_tries_allowed: 2
              type: 3GPP
            - cause_codes:
                - 33
              num_tries_allowed: 2
              type: 3GPP
        - apn: vsbladmin
          type_mask: 512
          allowed_ip_stack: ipv4v6
        - apn: vzwemergency
          type_mask: 262144
          tech_type_mask: 262144
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4v6
    apple:
        carrier_entitlements:
            supported_entitlements: 1209
    e911:
        emergency_urns:
            "922": 922@vzims.com
        over_itech_supported: false
        wifi_calling_without_entitlement: false
    entitlement:
        entitlement_url: https://spc.myvzw.com/ium-RoadrunnerInterface/servlet/IUMServlet
    ims:
        apn: vsblims
        epdg:
            address: wo.vzwwo.com
            configuration_attributes:
                - identifier: 16390
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes128
                      integrity:
                        - sha1
                      protocol: esp
                      rekey_pfs_group: 2
                      esn: auto
                      install_policies: true
                      secure_rekey: false
                      lifetime_seconds: 86400
            disable_switch_to_natt_port: true
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: anonymous@nai.epc.mnc480.mcc311.3gppnetwork.org
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha1
                  prf:
                    - sha1
                  dh_groups:
                    - 2
                  lifetime_seconds: 80000
                  authentication_method: Certificate
                  eap_method: EAP-AKA
            remote_certificate_authority_name: Verizon Wireless ROOT CA - RSA
            remote_certificate_hostname: wo.vzwwo.com
            username: 0$imsi@nai.epc.mnc480.mcc311.3gppnetwork.org
            validate_remote_certificate: true
        ip_stack: ipv6
        media:
            rtcp_inactivity_seconds: 20
            rtp_inactivity_seconds: 20
        signaling:
            additional_headers:
                - selector: INVITE[911,wifi]
                  headers:
                    - 'P-com.ServiceType: Static-Emergency'
            csfb_on:
                - method: INVITE
                  statuses:
                    - "503"
            early_media_needs_header: false
            preconditions: unsupported
            require_preconditions_when_mandatory: false
            sip_timers:
                D: 128000
                F: 30000
                InviteResponseTimeout: 10000
                T1: 3000
                T2: 16000
                T4: 17000
            support_p_early_media: false
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: true
