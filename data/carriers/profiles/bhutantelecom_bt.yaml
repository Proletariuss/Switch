version: 3
kind: carrier_bundle
id: apple_bhutantelecom_bt
bundle: BhutanTelecom_bt.bundle
supported_plmns:
    - "40211"
plmn_overrides:
    "40211":
        apns:
            - apn: internet
              type_mask: 49
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4
            - apn: ims
              type_mask: 131072
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4v6
            - apn: hos
              type_mask: 1048576
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4
        ims:
            apn: ims
            ip_stack: ipv4v6
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: false
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "380"
                        - 5XX
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: INVITE,INVITE:*
                          params:
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                            - +g.3gpp.mid-call
            media:
                rtp_inactivity_seconds: 20
            volte:
                enable_volte_by_default: true
