version: 3
kind: carrier_bundle
id: apple_vimpelcom_kz
bundle: VimpelCom_kz.bundle
supported_plmns:
    - "40101"
plmn_overrides:
    "40101":
        apns:
            - apn: internet.beeline.kz
              type_mask: 49
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4
        ims:
            register:
                use_ipsec: true
            signaling:
                support_p_early_media: false
                early_media_needs_header: false
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            volte:
                enable_volte_by_default: true
