version: 3
kind: carrier_bundle
id: apple_mirs_il
bundle: Mirs_il.bundle
supported_plmns:
    - "20404"
    - "20809"
    - "42507"
common:
    apns:
        - apn: net.hotm
          type_mask: 32769
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4
        - apn: mms.hotm
          type_mask: 4
        - apn: pc.hotm
          type_mask: 48
        - apn: ims
          type_mask: 131072
          tech_type_mask: 131072
          allowed_ip_stack: ipv4v6
          support_switch_over: true
          use_network_mtu: true
        - apn: xcap
          type_mask: 1048576
          tech_type_mask: 1048576
          allowed_ip_stack: ipv4
        - apn: sos
          type_mask: 262144
          tech_type_mask: 262144
          allowed_ip_stack: ipv4v6
    apple:
        carrier_entitlements:
            supported_entitlements: 9217
    e911:
        over_itech_supported: false
        wifi_calling_without_entitlement: true
    entitlement:
        entitlement_url: https://hotmes.hotmobile.co.il/entitlement/
    ims:
        apn: ims
        epdg:
            address: epdg.epc.mnc007.mcc425.pub.3gppnetwork.org
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
        ike:
            child_sa:
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes128
                      integrity:
                        - sha256
                      esn: auto
                      install_policies: true
                      lifetime_seconds: 86400
                replay_window_size: 12
            dpd:
                enabled: true
                interval_seconds: 1800
                max_retries: 5
                retry_interval_seconds: 10
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            nat_keepalive_enabled: true
            nat_keepalive_seconds: 20
            proposals:
                - encryption:
                    - aes128
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - 14
                  lifetime_seconds: 86400
                  authentication_method: None
                  eap_method: EAP-AKA
        ip_stack: ipv4v6
        media:
            rtp_inactivity_seconds: 15
        register:
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                always_add_sip_instance: false
            early_media_needs_header: true
            preconditions: supported
            require_preconditions_when_mandatory: false
            support_p_early_media: true
        ussi:
            enabled: true
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: false
