version: 3
kind: carrier_bundle
id: apple_carolinawest_lte_us
bundle: CarolinaWest_LTE_US.bundle
supported_plmns:
    - "310130"
plmn_overrides:
    "310130":
        apns:
            - apn: home.cww.com
              type_mask: 33281
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4v6
            - apn: ims
              type_mask: 131072
              tech_type_mask: 131072
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4v6
              support_switch_over: true
            - apn: tethering.cww.com
              type_mask: 48
              allowed_ip_stack: ipv4
            - apn: mms
              type_mask: 6
              tech_type_mask: 6
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4v6
            - apn: hos
              type_mask: 1048576
              tech_type_mask: 1048576
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4v6
            - apn: sos
              type_mask: 262144
              tech_type_mask: 262144
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4v6
              allow_no_dns: 1
        apple:
            carrier_entitlements:
                supported_entitlements: 1169
        e911:
            over_itech_supported: false
        entitlement:
            entitlement_url: https://cww.dcc.entitlements.io3.com/
        ims:
            apn: ims
            ip_stack: ipv4v6
            impi_format: imsi@carrierDomain
            impu_format: imsi@carrierDomain
            epdg:
                address: epdg.epc.mnc130.mcc310.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha512
                      prf:
                        - sha512
                      dh_groups:
                        - 14
                      lifetime_seconds: 43200
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha512
                          rekey_pfs_group: 15
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 43200
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                local_identifier_type: IDUserFQDN
                remote_identifier_type: IDFQDN
                validate_remote_certificate: false
            register:
                use_ipsec: true
                include_cellular_network_info: false
            signaling:
                max_udp_message_size: 1300
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                additional_headers:
                    - selector: INVITE[911,wifi]
                      headers:
                        - 'Supported: geolocation'
            media:
                rtp_inactivity_seconds: 20
                rtcp_inactivity_seconds: 20
                rtcp_interval_seconds: 5
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: true
