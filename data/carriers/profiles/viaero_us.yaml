version: 3
kind: carrier_bundle
id: apple_viaero_us
bundle: Viaero_US.bundle
supported_plmns:
    - "310450"
plmn_overrides:
    "310450":
        apns:
            - apn: ims
              type_mask: 131072
              tech_type_mask: 131072
              allowed_ip_stack: ipv6
              support_switch_over: true
            - apn: internet.vedge.com
              type_mask: 32817
            - apn: mms
              type_mask: 6
              tech_type_mask: 6
              allowed_ip_stack: ipv4v6
            - apn: internet.vedge.com
              type_mask: 48
            - apn: hos
              type_mask: 1048576
              tech_type_mask: 1048576
              allowed_ip_stack: ipv4
              roaming_ip_stack: ipv4
              support_switch_over: true
            - apn: sos
              type_mask: 262144
              tech_type_mask: 262144
              allowed_ip_stack: ipv6
        apple:
            carrier_entitlements:
                supported_entitlements: 176
        e911:
            over_itech_supported: false
            wifi_calling_without_entitlement: false
        entitlement:
            entitlement_url: https://ses.mnc450.mcc310.pub.3gppnetwork.org
        ims:
            apn: ims
            ip_stack: ipv6
            epdg:
                address: epdg.epc.mnc450.mcc310.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 20
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 21
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha512
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: true
                    max_retries: 3
                    retry_interval_seconds: 15
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha512
                          rekey_pfs_group: 14
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 86400
                    replay_window_size: 12
                validate_remote_certificate: false
            register:
                use_ipsec: true
                expires: 7200
                include_cellular_network_info: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "380"
                        - "414"
                        - "499"
                        - "606"
                require_preconditions_when_mandatory: false
                additional_headers:
                    - selector: INVITE[wifi,911]
                      headers:
                        - 'P-Emergency-Info: IEEE-802.11b;i-wlan-node-id=${DEVICE_REF_ID}'
                        - 'Supported: geolocation'
                sip_timers:
                    InviteResponseTimeout: 5000
            media:
                rtp_inactivity_seconds: 30
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: true
