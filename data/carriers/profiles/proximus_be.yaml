version: 3
kind: carrier_bundle
id: apple_proximus_be
bundle: Proximus_be.bundle
supported_plmns:
    - "20601"
plmn_overrides:
    "20601":
        apns:
            - apn: internet.proximus.be
              type_mask: 32819
              tech_type_mask: 2
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4v6
            - apn: event.proximus.be
              username: mms
              password: mms
              type_mask: 4
              allowed_ip_stack: ipv4
            - apn: ims
              type_mask: 131072
              tech_type_mask: 131072
              allowed_ip_stack: ipv4v6
              domestic_roaming_ip_stack: ipv4v6
              support_switch_over: true
            - apn: hos
              type_mask: 1048576
              tech_type_mask: 1048576
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4v6
        apple:
            carrier_entitlements:
                supported_entitlements: 4202513
        e911:
            over_itech_supported: true
            wifi_calling_without_entitlement: true
        entitlement:
            entitlement_url: https://prod.ses.proximus.be:443
        ims:
            apn: ims
            ip_stack: ipv4v6
            epdg:
                address: epdg.epc.mnc001.mcc206.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16385
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 86400
                      authentication_method: None
                      eap_method: EAP-AKA
                nat_keepalive_enabled: true
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: 14
                          esn: auto
                          lifetime_seconds: 86400
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "380"
                        - "400"
                        - "405"
                        - "406"
                        - "408"
                        - "413"
                        - "414"
                        - "415"
                        - "416"
                        - "417"
                        - "420"
                        - "480"
                        - "485"
                        - "488"
                        - "500"
                        - "502"
                        - "503"
                        - "504"
                        - "505"
                        - "513"
                        - "580"
                require_preconditions_when_mandatory: false
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*[primary]
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                sip_timers:
                    InviteResponseTimeout: 4000
            media:
                rtp_inactivity_seconds: 20
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: false
