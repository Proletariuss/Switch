version: 3
kind: carrier_bundle
id: apple_vodafone_nz
bundle: Vodafone_nz.bundle
supported_plmns:
    - "53001"
plmn_overrides:
    "53001":
        apns:
            - apn: ims
              type_mask: 131072
              tech_type_mask: 131072
              support_switch_over: true
            - apn: web
              type_mask: 32817
            - apn: mms
              type_mask: 4
              tech_type_mask: 4
              allowed_ip_stack: ipv4v6
            - apn: xcap
              type_mask: 1048576
              tech_type_mask: 1048576
            - apn: SOS
              type_mask: 262144
              tech_type_mask: 262144
              allowed_ip_stack: ipv4
              allow_no_dns: 1
        apple:
            carrier_entitlements:
                supported_entitlements: 533505
        e911:
            over_itech_supported: true
            wifi_calling_without_entitlement: true
        entitlement:
            entitlement_url: https://esim.one.nz/entitlement/
        ims:
            apn: ims
            epdg:
                address: epdg.epc.mnc001.mcc530.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 20
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 21
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 86400
                      authentication_method: None
                      eap_method: EAP-AKA
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: 14
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 86400
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                require_preconditions_when_mandatory: false
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                sip_timers:
                    InviteResponseTimeout: 6000
            media:
                rtp_inactivity_seconds: 20
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: true
