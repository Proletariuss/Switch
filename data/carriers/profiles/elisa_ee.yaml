version: 3
kind: carrier_bundle
id: apple_elisa_ee
bundle: Elisa_ee.bundle
supported_plmns:
    - "24802"
plmn_overrides:
    "24802":
        apns:
            - apn: internet
              type_mask: 32817
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4v6
            - apn: ims
              type_mask: 131072
              tech_type_mask: 131072
              allowed_ip_stack: ipv6
              support_switch_over: true
              support_5g_sa_handover: true
              use_network_mtu: true
            - apn: mms
              type_mask: 4
            - apn: xcap
              type_mask: 1048576
              tech_type_mask: 1048576
              allowed_ip_stack: ipv6
              roaming_ip_stack: ipv4v6
            - apn: sos
              type_mask: 262144
              allowed_ip_stack: ipv4v6
              allow_no_dns: 1
        apple:
            carrier_entitlements:
                supported_entitlements: 5313
        e911:
            over_itech_supported: true
            wifi_calling_without_entitlement: false
        entitlement:
            entitlement_url: https://entitlement1.ses.elisa.ee:8443
        ims:
            apn: ims
            ip_stack: ipv6
            epdg:
                address: epdg.epc.mnc002.mcc248.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 21
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: 14
                          esn: auto
                          lifetime_seconds: 6000
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: false
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                        - 6XX
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                rtcp_interval_seconds: 5
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: true
