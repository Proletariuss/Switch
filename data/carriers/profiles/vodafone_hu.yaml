version: 3
kind: carrier_bundle
id: apple_vodafone_hu
bundle: Vodafone_hu.bundle
supported_plmns:
    - "21670"
plmn_overrides:
    "21670":
        apns:
            - apn: internet
              type_mask: 49
              allowed_ip_stack: ipv4
            - apn: ims
              type_mask: 131072
              allowed_ip_stack: ipv4v6
            - apn: mms
              type_mask: 4
              allowed_ip_stack: ipv4
            - apn: hos
              type_mask: 1048576
              tech_type_mask: 1048576
              allowed_ip_stack: ipv4v6
              no_cellular_reconnect_cause_codes:
                - cause_codes:
                    - 27
                    - 29
                    - 30
                    - 31
                    - 32
                    - 33
                    - 38
                    - 91
                  recovers_on_airplane_mode: true
        apple:
            carrier_entitlements:
                supported_entitlements: 5121
        entitlement:
            entitlement_url: https://ios.entitlement.one.hu
        ims:
            apn: ims
            ip_stack: ipv4v6
            epdg:
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 20
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
                    - identifier: 21
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 86400
                      authentication_method: None
                      eap_method: EAP-AKA
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 15
                      lifetime_seconds: 86400
                      authentication_method: None
                      eap_method: EAP-AKA
                    - encryption:
                        - aes256
                      integrity:
                        - sha512
                      prf:
                        - sha512
                      dh_groups:
                        - 14
                      lifetime_seconds: 86400
                      authentication_method: None
                      eap_method: EAP-AKA
                    - encryption:
                        - aes256
                      integrity:
                        - sha512
                      prf:
                        - sha512
                      dh_groups:
                        - 15
                      lifetime_seconds: 86400
                      authentication_method: None
                      eap_method: EAP-AKA
                nat_keepalive_enabled: true
                nat_keepalive_seconds: 20
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes128
                            - aes256
                          integrity:
                            - sha256
                          esn: auto
                          lifetime_seconds: 86400
            register:
                use_ipsec: false
            signaling:
                preconditions: unsupported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                        - 6XX
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*[primary]
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                            - 3gpp-service.ims.icsi.mmtel
            media:
                rtp_inactivity_seconds: 10
                rtcp_interval_seconds: 5
            volte:
                enable_volte_by_default: true
