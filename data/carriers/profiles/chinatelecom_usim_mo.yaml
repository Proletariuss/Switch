version: 3
kind: carrier_bundle
id: apple_chinatelecom_usim_mo
bundle: ChinaTelecom_USIM_mo.bundle
supported_plmns:
    - "20404"
    - "45507"
common:
    apns:
        - apn: CTNET
          type_mask: 1081905
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4v6
        - apn: CTWAP
          type_mask: 4
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4v6
        - apn: CTNET
          type_mask: 1049136
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4v6
        - apn: ims
          type_mask: 131072
          tech_type_mask: 131072
          allowed_ip_stack: ipv6
          roaming_ip_stack: ipv6
          support_switch_over: true
          wait_for_bring_up_complete: true
        - apn: CTNET
          type_mask: 565
        - apn: CTNET
          type_mask: 564
        - apn: sos
          type_mask: 262144
          tech_type_mask: 262144
          allowed_ip_stack: ipv6
          roaming_ip_stack: ipv6
          allow_no_dns: 1
    apple:
        carrier_entitlements:
            supported_entitlements: 8192
    e911:
        emergency_urns:
            "110": urn:service:sos.police
            "119": urn:service:sos.fire
            "120": urn:service:sos.ambulance
            "993": urn:service:sos.mountain
            "999": urn:service:sos.police
    entitlement:
        entitlement_url: https://ios-es.1888.com.mo
    ims:
        apn: ims
        domain: ims.mnc007.mcc455.3gppnetwork.org
        impi_format: imsi@carrierDomain
        impu_format: imsi@carrierDomain
        ip_stack: ipv6
        media:
            rtcp_inactivity_seconds: 20
            rtcp_interval_seconds: 5
        register:
            use_ipsec: true
        signaling:
            early_media_needs_header: true
            require_preconditions_when_mandatory: false
            require_qos_before_ringing: true
            support_p_early_media: true
        ussi:
            enabled: true
        volte:
            enable_volte_by_default: true
