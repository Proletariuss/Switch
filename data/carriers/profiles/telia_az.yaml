version: 3
kind: carrier_bundle
id: apple_telia_az
bundle: Telia_az.bundle
supported_plmns:
    - "40001"
plmn_overrides:
    "40001":
        apns:
            - apn: internet
              type_mask: 49
            - apn: ims
              type_mask: 131072
              tech_type_mask: 131072
              support_switch_over: true
              allow_no_dns: 1
        apple:
            carrier_entitlements:
                supported_entitlements: 1
        entitlement:
            entitlement_url: https://es.azercell.com
        ims:
            apn: ims
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*[primary]
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            volte:
                enable_volte_by_default: true
