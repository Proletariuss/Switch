version: 3
kind: carrier_bundle
id: apple_cw_pa
bundle: CW_pa.bundle
supported_plmns:
    - "71401"
plmn_overrides:
    "71401":
        apns:
            - apn: apn01.cwpanama.com.pa
              type_mask: 32817
              allowed_ip_stack: ipv4v6
            - apn: apn02.cwpanama.com.pa
              type_mask: 4
            - apn: apn01.cwpanama.com.pa
              type_mask: 32816
              allowed_ip_stack: ipv4v6
            - apn: ims
              type_mask: 131072
              tech_type_mask: 131072
              allowed_ip_stack: ipv4
              support_switch_over: true
            - apn: sos
              type_mask: 262144
              tech_type_mask: 262144
              allowed_ip_stack: ipv4v6
        apple:
            carrier_entitlements:
                supported_entitlements: 8209
        e911:
            over_itech_supported: false
            wifi_calling_without_entitlement: true
        entitlement:
            entitlement_url: https://ses.mnc001.mcc714.pub.3gppnetwork.org
        ims:
            apn: ims
            ip_stack: ipv4
            epdg:
                address: epdg.epc.mnc001.mcc714.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: true
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha256
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 80000
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 1280
                preconditions: unsupported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                        - 6XX
                require_preconditions_when_mandatory: false
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                sip_timers:
                    InviteResponseTimeout: 4500
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: true
