version: 3
kind: carrier_bundle
id: apple_orange_pl
bundle: Orange_pl.bundle
supported_plmns:
    - "26003"
plmn_overrides:
    "26003":
        apns:
            - apn: internet
              username: internet
              password: internet
              type_mask: 48
            - apn: mms
              username: mms
              password: mms
              type_mask: 4
              tech_type_mask: 4
            - apn: ims
              type_mask: 131072
              tech_type_mask: 131072
              allowed_ip_stack: ipv6
              support_switch_over: true
              use_network_mtu: true
              allow_no_dns: 1
            - apn: internetipv6
              username: internet
              password: internet
              type_mask: 32771
              allowed_ip_stack: ipv6
              roaming_ip_stack: ipv4
              xlat464_enabled: true
            - apn: hos
              type_mask: 1048576
              tech_type_mask: 1048576
              allowed_ip_stack: ipv4v6
              use_network_mtu: true
        apple:
            carrier_entitlements:
                supported_entitlements: 1233
        e911:
            over_itech_supported: true
            wifi_calling_without_entitlement: false
        entitlement:
            entitlement_url: https://aes.orange.pl/ium-OEMInterface/servlet/IUMServlet
        ims:
            apn: ims
            ip_stack: ipv6
            epdg:
                address: epdg.epc.mnc003.mcc260.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 20
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 21
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes128
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 5
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                nat_keepalive_enabled: true
                nat_keepalive_seconds: 20
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes128
                          integrity:
                            - sha256
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 80000
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                remote_identifier_type: KeyID
                validate_remote_certificate: false
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "403"
                        - "408"
                        - 5XX
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                additional_headers:
                    - selector: INVITE
                      headers:
                        - 'Accept: application/sdp,application/3gpp-ims+xml'
                    - selector: INVITE,INVITE:*
                      headers:
                        - 'Feature-Caps: *;+g.3gpp.srvcc-alerting'
                sip_timers:
                    InviteResponseTimeout: 3000
            media:
                rtp_inactivity_seconds: 20
                rtcp_interval_seconds: 5
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
