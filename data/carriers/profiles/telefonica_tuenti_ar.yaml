version: 3
kind: carrier_bundle
id: apple_telefonica_tuenti_ar
bundle: Telefonica_Tuenti_ar.bundle
supported_plmns:
    - "722010"
plmn_overrides:
    "722010":
        apns:
            - apn: internet.tuenti
              username: internet
              password: internet
              type_mask: 49
              allowed_ip_stack: ipv4v6
            - apn: ims
              type_mask: 131072
              allowed_ip_stack: ipv6
              support_switch_over: true
        e911:
            over_itech_supported: false
            wifi_calling_without_entitlement: true
        ims:
            apn: ims
            ip_stack: ipv6
            epdg:
                address: epdg.epc.mnc010.mcc722.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                nat_keepalive_enabled: true
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: 14
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 86400
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: false
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.srvcc-alerting
            media:
                rtp_inactivity_seconds: 10
                rtcp_inactivity_seconds: 25
                rtcp_interval_seconds: 5
            ussi:
                enabled: false
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: true
