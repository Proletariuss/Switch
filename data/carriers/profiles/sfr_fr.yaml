version: 3
kind: carrier_bundle
id: apple_sfr_fr
bundle: SFR_fr.bundle
supported_plmns:
    - "20810"
plmn_overrides:
    "20810":
        apns:
            - apn: sl2sfr
              type_mask: 1081399
              tech_type_mask: 1081351
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4
              allow_no_dns: 1
            - apn: ims
              type_mask: 131072
              tech_type_mask: 131072
              allowed_ip_stack: ipv6
              support_switch_over: true
              support_5g_sa_handover: true
        apple:
            carrier_entitlements:
                supported_entitlements: 4236289
        e911:
            over_itech_supported: true
            wifi_calling_without_entitlement: true
        entitlement:
            entitlement_url: https://apple-entitlement.sd-sfr.fr
        ims:
            apn: ims
            ip_stack: ipv6
            epdg:
                address: epdg.epc.mnc010.mcc208.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 16390
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes128
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                nat_keepalive_enabled: true
                nat_keepalive_seconds: 20
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes128
                          integrity:
                            - sha256
                          esn: auto
                          lifetime_seconds: 86400
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                validate_remote_certificate: false
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: false
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                additional_headers:
                    - selector: INVITE
                      headers:
                        - 'Accept: application/sdp,application/3gpp-ims+xml'
                    - selector: INVITE,INVITE:*
                      headers:
                        - 'Feature-Caps: *;+g.3gpp.srvcc-alerting'
                sip_timers:
                    InviteResponseTimeout: 4000
            media:
                rtp_inactivity_seconds: 30
                rtcp_interval_seconds: 5
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: false
