version: 3
kind: carrier_bundle
id: apple_movistar_uy
bundle: movistar_uy.bundle
supported_plmns:
    - "74807"
plmn_overrides:
    "74807":
        apns:
            - apn: webapn.movistar.com.uy
              username: movistar
              password: movistar
              type_mask: 49
              allowed_ip_stack: ipv4
              domestic_roaming_ip_stack: ipv4
              apple_options:
                AllowedProtocolMaskInRoaming: "1"
            - apn: ims
              type_mask: 131072
              allowed_ip_stack: ipv6
              support_switch_over: true
        ims:
            apn: ims
            ip_stack: ipv6
            register:
                use_ipsec: true
            signaling:
                max_udp_message_size: 1500
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - "403"
                        - "408"
                        - 5XX
                        - 6XX
                require_preconditions_when_mandatory: false
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
            volte:
                enable_volte_by_default: true
