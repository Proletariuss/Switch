version: 3
kind: carrier_bundle
id: apple_omnitel_lt
bundle: Omnitel_lt.bundle
supported_plmns:
    - "24601"
plmn_overrides:
    "24601":
        apns:
            - apn: omnitel
              username: omni
              password: omni
              type_mask: 32817
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4v6
            - apn: gprs.mms.lt
              username: mms
              password: mms
              type_mask: 4
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4v6
            - apn: ims
              type_mask: 131072
              allowed_ip_stack: ipv4v6
              support_switch_over: true
            - apn: hos
              type_mask: 1048576
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4v6
        apple:
            carrier_entitlements:
                supported_entitlements: 13313
        entitlement:
            entitlement_url: https://es.mnc001.mcc246.pub.3gppnetwork.org:8443
        ims:
            apn: ims
            ip_stack: ipv4v6
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                        - 6XX
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*[primary]
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                rtp_inactivity_seconds: 10
                rtcp_interval_seconds: 5
            volte:
                enable_volte_by_default: true
