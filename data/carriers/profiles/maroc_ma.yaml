version: 3
kind: carrier_bundle
id: apple_maroc_ma
bundle: Maroc_ma.bundle
supported_plmns:
    - "60401"
plmn_overrides:
    "60401":
        apns:
            - apn: www.iamgprs1.ma
              type_mask: 49
            - apn: mmsiam
              type_mask: 4
            - apn: ims
              type_mask: 131072
              allowed_ip_stack: ipv4
              allow_no_dns: 1
        ims:
            apn: ims
            ip_stack: ipv4
            register:
                use_ipsec: true
                expires: 7200
            signaling:
                preconditions: unsupported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 5XX
                        - 6XX
                require_preconditions_when_mandatory: false
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                additional_headers:
                    - selector: INVITE,INVITE:*
                      headers:
                        - 'Feature-Caps: *;+g.3gpp.srvcc-alerting'
            media:
                rtp_inactivity_seconds: 15
                rtcp_interval_seconds: 5
