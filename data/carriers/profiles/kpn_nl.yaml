version: 3
kind: carrier_bundle
id: apple_kpn_nl
bundle: KPN_nl.bundle
supported_plmns:
    - "20408"
    - "20469"
common:
    apns:
        - apn: internet
          type_mask: 32819
          tech_type_mask: 2
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4v6
          xlat464_enabled: true
        - apn: ims
          type_mask: 131072
          tech_type_mask: 131072
          allowed_ip_stack: ipv6
          support_switch_over: true
        - apn: ut
          type_mask: 1048576
          tech_type_mask: 1048576
          allowed_ip_stack: ipv4v6
          xlat464_enabled: true
          allow_no_dns: 1
    apple:
        carrier_entitlements:
            supported_entitlements: 13313
    e911:
        over_itech_supported: true
        wifi_calling_without_entitlement: true
    entitlement:
        entitlement_url: https://KPN.entitlements.io3.com
    ims:
        apn: ims
        epdg:
            address: epdg.epc.mnc008.mcc204.pub.3gppnetwork.org
            configuration_attributes:
                - identifier: 16390
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes256
                      integrity:
                        - sha256
                      esn: auto
                      lifetime_seconds: 86400
                replay_window_size: 12
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            nat_keepalive_enabled: true
            nat_keepalive_seconds: 20
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - 14
                  lifetime_seconds: 80000
                  authentication_method: None
                  eap_method: EAP-AKA
            validate_remote_certificate: false
        ip_stack: ipv6
        media:
            rtcp_inactivity_seconds: 180
            rtcp_interval_seconds: 5
            rtp_inactivity_seconds: 20
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            csfb_on:
                - method: INVITE
                  statuses:
                    - 3XX
                    - 4XX
                    - 5XX
            early_media_needs_header: true
            preconditions: unsupported
            require_preconditions_when_mandatory: false
            sip_timers:
                InviteResponseTimeout: 4000
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: false
