version: 3
kind: carrier_bundle
id: apple_optus_au
bundle: Optus_au.bundle
supported_plmns:
    - "50502"
plmn_overrides:
    "50502":
        apns:
            - apn: IMS
              password: password
              type_mask: 131072
              tech_type_mask: 131072
              allowed_ip_stack: ipv6
              support_switch_over: true
              support_5g_sa_handover: true
              apple_options:
                AllowedProtocolMaskInRoaming: 0
            - apn: yesinternet
              type_mask: 32819
              allowed_ip_stack: ipv4
              apple_options:
                AllowedProtocolMaskInRoaming: 0
            - apn: mms
              type_mask: 4
              tech_type_mask: 4
              apple_options:
                AllowedProtocolMaskInRoaming: 0
            - apn: HOS
              type_mask: 1048576
              tech_type_mask: 1048576
              allowed_ip_stack: ipv4
            - apn: sos
              type_mask: 262144
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4v6
              allow_no_dns: 1
        apple:
            carrier_entitlements:
                supported_entitlements: 9217
        e911:
            over_itech_supported: true
            wifi_calling_without_entitlement: true
        entitlement:
            entitlement_url: https://oes.optusnet.com.au
        ims:
            apn: ims
            ip_stack: ipv6
            epdg:
                address: epdg.epc.mnc002.mcc505.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 86400
                      authentication_method: Certificate
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: 14
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 86400
                    replay_window_size: 12
                local_identifier: Optus@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                username: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                remote_certificate_authority_name: DigiCert Global Root G2
                remote_certificate_hostname: epdg.epc.mnc002.mcc505.pub.3gppnetwork.org
                validate_remote_certificate: true
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                preconditions: unsupported
                support_p_early_media: true
                early_media_needs_header: true
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.srvcc-alerting
            media:
                rtp_inactivity_seconds: 20
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: false
