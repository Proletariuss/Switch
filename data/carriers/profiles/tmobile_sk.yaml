version: 3
kind: carrier_bundle
id: apple_tmobile_sk
bundle: TMobile_sk.bundle
supported_plmns:
    - "23102"
plmn_overrides:
    "23102":
        apns:
            - apn: internet
              type_mask: 32817
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4
              xlat464_enabled: true
            - apn: ims
              type_mask: 131072
              tech_type_mask: 131072
              allowed_ip_stack: ipv6
              roaming_ip_stack: ipv6
              support_switch_over: true
              no_cellular_reconnect_cause_codes:
                - cause_codes:
                    - 33
                  recovers_on_airplane_mode: true
                  num_tries_allowed: 2
                  type: 3GPP
                  timeout: 86400
            - apn: hos
              type_mask: 1048580
              tech_type_mask: 1048580
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4
              xlat464_enabled: true
        apple:
            carrier_entitlements:
                supported_entitlements: 4207617
        e911:
            over_itech_supported: true
        entitlement:
            entitlement_url: https://entitlement-sk.telekom.net
        ims:
            apn: ims
            ip_stack: ipv6
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                require_preconditions_when_mandatory: false
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*[primary]
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                sip_timers:
                    InviteResponseTimeout: 4000
            media:
                rtp_inactivity_seconds: 20
                rtcp_inactivity_seconds: 180
                rtcp_interval_seconds: 5
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
