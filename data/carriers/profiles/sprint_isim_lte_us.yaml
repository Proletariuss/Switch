version: 3
kind: carrier_bundle
id: apple_sprint_isim_lte_us
bundle: Sprint_ISIM_LTE_US.bundle
supported_plmns:
    - "310120"
    - "312530"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 3521
    e911:
        over_itech_supported: true
    entitlement:
        entitlement_url: https://deg.spcsdns.net/ium-OEMInterface/servlet/IUMServlet
    ims:
        epdg:
            address: epdg.epc.mnc530.mcc312.pub.3gppnetwork.org
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 21
                  name: AssignedPCSCFIPv6
                  type: v6
                - identifier: 21
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes128
                      integrity:
                        - sha1
                      esn: auto
                      lifetime_seconds: 86400
                replay_window_size: 12
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            local_identifier_type: IDUserFQDN
            proposals:
                - encryption:
                    - aes128
                  integrity:
                    - sha1
                  prf:
                    - sha1
                  dh_groups:
                    - 2
                  lifetime_seconds: 80000
                  authentication_method: None
                  eap_method: EAP-AKA
            remote_certificate_hostname: compgw.vowifi2.spcsdns.net
            remote_identifier_type: IDFQDN
            validate_remote_certificate: true
        media:
            rtcp_inactivity_seconds: 30
            rtp_inactivity_seconds: 30
        register:
            include_cellular_network_info: true
            use_ipsec: false
        signaling:
            contact:
                always_add_sip_instance: true
            early_media_needs_header: true
            max_udp_message_size: 1200
            preconditions: supported
            require_preconditions_when_mandatory: false
            sip_timers:
                F: 30000
                InviteResponseTimeout: 0
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
