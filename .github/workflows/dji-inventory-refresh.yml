name: Refresh DJI migration inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dji-rust-module-replacement-vowifi
      - name: Generate inventory
        run: python3 scripts/check-rust-migration-contracts.py --require-rust-only --write-inventory
      - uses: actions/upload-artifact@v4
        with:
          name: dji-contract-inventory
          path: docs/optimization/all-rust/api-contract-inventory.json
