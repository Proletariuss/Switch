name: Isolated C Swift smoke
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed C source commit; must be an ancestor of this smoke workflow commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: isolated-c-swift-smoke
  cancel-in-progress: true
jobs:
  swift:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: src
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and checkout the exact C source
        working-directory: src
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA"
          git checkout --detach "$SOURCE_SHA"
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
      - name: Compile and run only the offline device SMS Swift fixtures
        working-directory: src
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          export SWITCH_TEST_TMPDIR="$GITHUB_WORKSPACE/build/ci-swift-tmp/"
          mkdir -p "$GITHUB_WORKSPACE/reports"
          echo "source_sha=$SOURCE_SHA" > "$GITHUB_WORKSPACE/reports/source.txt"
          bash scripts/test-device-sms-send.sh 2>&1 | tee "$GITHUB_WORKSPACE/reports/device-sms.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: isolated-c-swift-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: error
          retention-days: 7
