name: Review Switch changes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      prepare_reviewed:
        description: Only prepare the explicit reviewed allowlist on automation/cloud-four-batches
        required: false
        default: false
        type: boolean
      candidate_sha:
        description: Optional exact 40-character commit for a candidate (empty uses dispatch SHA)
        required: false
        type: string
      build_app:
        description: Also build Switch.app after the software gates
        required: false
        default: false
        type: boolean
  schedule:
    # Monthly drift check. Pull requests remain the primary validation path.
    - cron: '43 3 1 * *'

permissions:
  contents: read

concurrency:
  group: switch-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare-inputs:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_reviewed
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - env:
          EXPECTED_COMMIT: ${{ inputs.candidate_sha }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/automation/cloud-four-batches ]]
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_COMMIT" == "$GITHUB_SHA" ]]
  prepare-reviewed:
    needs: prepare-inputs
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_reviewed && github.ref == 'refs/heads/automation/cloud-four-batches'
    permissions:
      contents: write
    uses: ./.github/workflows/reviewed-prepare.yml
    with:
      expected_commit: ${{ inputs.candidate_sha }}
  classify:
    if: github.event_name != 'workflow_dispatch' || !inputs.prepare_reviewed
    name: Classify changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.paths.outputs.commit }}
      needs_macos: ${{ steps.paths.outputs.needs_macos }}
      needs_app: ${{ steps.paths.outputs.needs_app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: src
          fetch-depth: 0
          persist-credentials: false
      - name: Select the proportional validation tier
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          MANUAL_BUILD_APP: ${{ inputs.build_app }}
        run: |
          set -euo pipefail
          needs_macos=false
          needs_app=false

          case "$EVENT_NAME" in
            pull_request)
              mapfile -t files < <(git -C src diff --name-only "$BASE_SHA" "$HEAD_SHA")
              for file in "${files[@]}"; do
                case "$file" in
                  rust/*|app/*|scripts/*|third_party/*|data/*|licenses/*|Switch.xcodeproj/*|project.yml|VERSION|BUILD_NUMBER|mise.toml|.github/*)
                    needs_macos=true
                    ;;
                esac
                case "$file" in
                  app/*|third_party/*|Switch.xcodeproj/*|project.yml|VERSION|BUILD_NUMBER|scripts/build*|scripts/workspace-env.sh|scripts/package-dmg.sh|scripts/audit-release-bundle.py|scripts/prepare-module-supervisor.py|.github/workflows/*|scripts/ci/*)
                    needs_app=true
                    ;;
                esac
              done
              ;;
            workflow_dispatch)
              needs_macos=true
              if [[ "$MANUAL_BUILD_APP" == "true" ]]; then
                needs_app=true
              fi
              ;;
            schedule)
              needs_macos=true
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 2
              ;;
          esac

          commit="$GITHUB_SHA"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$CANDIDATE_SHA" ]]; then
            [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
            # The workflow definition and tested source must be one revision.
            [[ "$CANDIDATE_SHA" == "$GITHUB_SHA" ]]
            commit="$CANDIDATE_SHA"
          fi
          {
            echo "commit=$commit"
            echo "needs_macos=$needs_macos"
            echo "needs_app=$needs_app"
          } >> "$GITHUB_OUTPUT"

  checks:
    needs: classify
    uses: ./.github/workflows/software-gates.yml
    with:
      commit: ${{ needs.classify.outputs.commit }}
      native: ${{ needs.classify.outputs.needs_macos == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
      build_app: ${{ needs.classify.outputs.needs_app == 'true' }}
  review-result:
    name: Review result
    if: always() && (github.event_name != 'workflow_dispatch' || !inputs.prepare_reviewed)
    needs: [classify, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      CHECKS_RESULT: ${{ needs.checks.result }}
    steps:
      - name: Reject failed or unexpectedly skipped checks
        run: |
          [[ "$CLASSIFY_RESULT" == "success" ]]
          [[ "$CHECKS_RESULT" == "success" ]]
