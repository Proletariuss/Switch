name: Build Switch

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: src
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - name: Install build dependencies
        run: brew install libusb xcodegen
      - name: Validate source version
        working-directory: src
        run: |
          set -eu
          set -- $(scripts/version.sh)
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$1"; fi
      - name: Prepare pinned ARM Rust standard library
        working-directory: src
        run: python3 scripts/prepare-module-supervisor.py --fetch
      - name: Fetch locked Rust build inputs
        working-directory: src
        run: CARGO_HOME="$GITHUB_WORKSPACE/build/cargo-home" cargo fetch --locked --manifest-path rust/Cargo.toml
      # The complete local migration gate also verifies frozen host-specific
      # acceptance receipts. Those provenance records are intentionally kept in
      # the source snapshot, but they are not a portable GitHub Runner gate.
      - name: Run portable source and Rust gates
        working-directory: src
        run: |
          export SWITCH_SOURCE_ROOT="$PWD"
          . scripts/workspace-env.sh
          scripts/preflight-source.sh
          python3 scripts/build-evs.py
          python3 scripts/build-module-supervisor.py
          (cd rust && cargo +1.98.0 fmt --all -- --check)
          (cd rust && cargo +1.98.0 test --locked --workspace --exclude proletariusd)
          (cd rust && cargo +1.98.0 test --locked -p proletariusd --bin switchd-rs --no-run)
          # These tests combine retained serial fixtures with startup work. Run
          # each exact case in a fresh process so fixture lifetimes stay
          # isolated while every real test failure still stops the workflow.
          for test in \
            native_serial_module_supervision_tests::public_serial_module_start_stop_retains_real_identity_and_rf_until_enter_settles \
            native_serial_module_supervision_tests::module_vowifi_http_request_id_replays_exact_operation_and_rejects_payload_drift \
            native_serial_module_supervision_tests::claimed_serial_before_radio_configuration_never_falls_back_to_live_usb_module \
            native_serial_module_supervision_tests::serial_module_full_card_aka_works_without_pdu_ready_and_failed_restore_keeps_hold \
            native_serial_module_supervision_tests::serial_module_changed_sim_sends_zero_authenticate_and_still_restores_exact_radio \
            native_serial_module_supervision_tests::captured_serial_intent_retired_before_hold_releases_without_touching_replacement_rf
          do
            (cd rust && cargo +1.98.0 test --locked -p proletariusd --bin switchd-rs "$test" -- --exact --test-threads=1)
          done
      - name: Build app (no disk image)
        working-directory: src
        run: scripts/build.sh
      - name: Preserve application permissions
        run: tar -czf dist/Switch.app.tar.gz -C dist Switch.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Switch-app
          path: dist/Switch.app.tar.gz
          if-no-files-found: error
          retention-days: 7
