name: Build Switch

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: src
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - name: Install build dependencies
        run: brew install libusb xcodegen
      - name: Validate source version
        working-directory: src
        run: |
          set -eu
          set -- $(scripts/version.sh)
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$1"; fi
      - name: Prepare pinned ARM Rust standard library
        working-directory: src
        run: python3 scripts/prepare-module-supervisor.py --fetch
      - name: Fetch locked Rust build inputs
        working-directory: src
        run: CARGO_HOME="$GITHUB_WORKSPACE/build/cargo-home" cargo fetch --locked --manifest-path rust/Cargo.toml
      # The complete local migration gate also verifies frozen host-specific
      # acceptance receipts. Those provenance records are intentionally kept in
      # the source snapshot, but they are not a portable GitHub Runner gate.
      - name: Run portable source and Rust gates
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          export SWITCH_SOURCE_ROOT="$PWD"
          . scripts/workspace-env.sh
          scripts/preflight-source.sh
          python3 scripts/build-evs.py
          python3 scripts/build-module-supervisor.py
          (cd rust && cargo +1.98.0 fmt --all -- --check)
          (cd rust && cargo +1.98.0 test --locked --workspace --exclude proletariusd)
          (cd rust && cargo +1.98.0 test --locked -p proletariusd -- --skip native_serial_module_supervision_tests::)
          # These tests combine retained serial fixtures with startup work. Run
          # each exact case in a fresh process so fixture lifetimes stay
          # isolated while every real test failure still stops the workflow.
          python3 - <<'PY'
          import subprocess

          base = [
              "cargo", "+1.98.0", "test", "--locked", "-p", "proletariusd",
              "--bin", "switchd-rs",
          ]
          prefix = "native_serial_module_supervision_tests::"
          listed = subprocess.run(
              base + [prefix, "--", "--list"],
              cwd="rust",
              check=True,
              text=True,
              stdout=subprocess.PIPE,
          )
          tests = [
              line[:-len(": test")]
              for line in listed.stdout.splitlines()
              if line.startswith(prefix) and line.endswith(": test")
          ]
          if len(tests) != 6 or len(set(tests)) != 6:
              raise SystemExit(f"expected 6 serial supervision tests, found {len(tests)}")
          for test in tests:
              subprocess.run(
                  base + [test, "--", "--exact", "--test-threads=1"],
                  cwd="rust",
                  check=True,
              )
          PY
      - name: Build app (no disk image)
        working-directory: src
        run: scripts/build.sh
      - name: Preserve application permissions
        run: tar -czf dist/Switch.app.tar.gz -C dist Switch.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Switch-app
          path: dist/Switch.app.tar.gz
          if-no-files-found: error
          retention-days: 7
