name: Build Switch candidate
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character commit SHA; must match the selected workflow ref
        required: true
        type: string
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: src
          persist-credentials: false
      - id: identity
        working-directory: src
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$REQUESTED_SHA" == "$commit" ]]
          fi
          set -- $(scripts/version.sh)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" == "v$1" ]]
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
  candidate:
    needs: identity
    uses: ./.github/workflows/software-gates.yml
    with:
      commit: ${{ needs.identity.outputs.commit }}
      native: true
      build_app: true
