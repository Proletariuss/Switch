name: Normalize approved stability snapshot
on:
  push:
    branches: [automation/stability-cloud-353]
permissions:
  contents: read
concurrency:
  group: switch-stability-normalization-353
  cancel-in-progress: false
jobs:
  normalize:
    if: github.repository == 'Proletariuss/Switch' && github.ref == 'refs/heads/automation/stability-cloud-353'
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Install the project generator
        run: brew install xcodegen
      - name: Normalize only the reviewed source and retire this entry point
        id: normalize
        working-directory: src
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/ci/normalize-stability-353.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stability-normalization-${{ github.run_id }}
          path: normalization-evidence/
          if-no-files-found: warn
          retention-days: 7
