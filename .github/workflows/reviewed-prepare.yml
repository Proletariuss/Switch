name: Prepare explicitly reviewed source
on:
  workflow_call:
    inputs:
      expected_commit:
        type: string
        required: true
permissions:
  contents: read
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/automation/cloud-four-batches'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: switch-reviewed-prepare
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_commit }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Apply only the reviewed allowlist
        id: prepare
        working-directory: src
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/ci/prepare-reviewed.py
      - name: Atomically advance the allowed candidate branch
        working-directory: src
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          PREPARED_COMMIT: ${{ steps.prepare.outputs.prepared_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target=refs/heads/automation/cloud-four-batches
          [[ "$GITHUB_REF" == "$target" ]]
          [[ "$(git rev-parse HEAD)" == "$PREPARED_COMMIT" ]]
          [[ "$(git rev-parse HEAD^)" == "$EXPECTED_COMMIT" ]]
          # A direct child plus an exact lease permits no overwrite/rewind.
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push             --force-with-lease="$target:$EXPECTED_COMMIT" origin "HEAD:$target"
          echo "Prepared commit: $PREPARED_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Run the ordinary quality workflow explicitly for this SHA.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reviewed-preparation-${{ inputs.expected_commit }}-${{ github.run_attempt }}
          path: prepared-evidence/
          if-no-files-found: error
          retention-days: 7
