name: Stability targeted regressions
on:
  push:
    branches: [automation/stability-diagnostics-353]
permissions:
  contents: read
concurrency:
  group: switch-stability-targeted
  cancel-in-progress: true
jobs:
  swift-transport:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: src
          persist-credentials: false
      - name: Real URLSession and Unix socket regressions
        working-directory: src
        run: bash scripts/test-api-request-policy.sh
      - name: Bounded socket cancellation and stream rejection
        working-directory: src
        run: bash scripts/test-unix-socket-transport.sh
