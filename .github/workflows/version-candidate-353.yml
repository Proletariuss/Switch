name: Prepare Switch 3.53 candidate version
on:
  push:
    branches: [automation/version-candidate-353]
permissions:
  contents: read
concurrency:
  group: switch-version-candidate-353
  cancel-in-progress: false
jobs:
  version:
    if: github.repository == 'Proletariuss/Switch' && github.ref == 'refs/heads/automation/version-candidate-353'
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.0
      - name: Install the project generator
        run: brew install xcodegen
      - name: Fetch both unchanged locked graphs before the offline version update
        working-directory: src
        run: |
          cargo +1.98.0 fetch --locked --manifest-path rust/Cargo.toml
          cargo +1.98.0 fetch --locked --manifest-path scripts/acceptance/daemon-capsule-fixture/Cargo.toml
      - name: Prepare only version metadata and retire this entry point
        working-directory: src
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/ci/prepare-version-353.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: version-candidate-${{ github.run_id }}
          path: version-evidence/
          if-no-files-found: warn
          retention-days: 7
