name: Prepare reviewed support route metadata 353
on:
  push:
    branches: [automation/support-route-prepare-353]
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    name: Publish validated support route preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          path: src
          persist-credentials: false
      - name: Publish exact validated preparation artifact
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/ci/support-route-prepare-353.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: support-route-prepared-evidence
          path: support-route-prepared-evidence/
          if-no-files-found: error
          retention-days: 7
