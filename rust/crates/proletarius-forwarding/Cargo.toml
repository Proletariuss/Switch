[package]
name = "proletarius-forwarding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
queue-format-v2-candidate = []
# Local durability foundation only. Real daemon owner coverage is still unproven.
root-bootstrap-candidate = ["queue-format-v2-candidate"]
# Explicit synthetic fixtures and fault callbacks; never a production authority.
root-bootstrap-fault-tests = ["root-bootstrap-candidate"]
# Isolated foundation only; no production migration or authority grant.
producer-admission-candidate = ["dep:proletarius-store"]
# Explicit test-only post-rename injection for the daemon's real HTTP boundary.
# Production builds never enable it through the normal dependency.
queue-fault-tests = ["proletarius-store?/raw-fault-tests"]

[dependencies]
proletarius-store = { path = "../proletarius-store", optional = true }
aes.workspace = true
aes-gcm.workspace = true
base64.workspace = true
cbc.workspace = true
getrandom.workspace = true
hmac.workspace = true
httpdate.workspace = true
nix.workspace = true
proletarius-system-proxy = { path = "../proletarius-system-proxy" }
reqwest.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
time.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
proletarius-store = { path = "../proletarius-store", features = ["raw-fault-tests"] }
